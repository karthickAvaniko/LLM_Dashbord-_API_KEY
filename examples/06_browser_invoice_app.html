<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Avaniko AI — Browser Invoice Demo</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #0a0a0f; color: #e0e0f0; }
  h1 { color: #e8a828; }
  .card { background: #14141c; border: 1px solid #2a2a36; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  input, button { font: inherit; }
  input[type=file] { margin: 8px 0; }
  button { background: #e8a828; color: #1a1004; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  pre { background: #06060a; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 12px; line-height: 1.6; }
  .warn { background: #4d2a16; border: 1px solid #f87171; border-radius: 8px; padding: 12px; font-size: 13px; }
</style>
</head>
<body>

<h1>📄 Invoice → JSON</h1>

<div class="warn">
  ⚠ <strong>Demo only.</strong> This calls Avaniko AI directly from the browser with the API key embedded.
  In production, use a backend proxy (see <code>customer-proxy-template/</code>).
</div>

<div class="card">
  <label>API key:
    <input type="password" id="apiKey" placeholder="ak_..." style="width: 100%; padding: 8px; background: #06060a; color: #e0e0f0; border: 1px solid #2a2a36; border-radius: 4px;" />
  </label>
</div>

<div class="card">
  <input type="file" id="file" accept=".pdf,.jpg,.jpeg,.png" />
  <button id="run">Extract</button>
</div>

<div class="card">
  <strong>Result:</strong>
  <pre id="output">Upload an invoice and click Extract.</pre>
</div>

<script type="module">
  import { configure, documents } from 'https://cdn.jsdelivr.net/npm/avaniko-ai@latest/avaniko-ai.js';

  document.getElementById('run').addEventListener('click', async () => {
    const key = document.getElementById('apiKey').value.trim();
    const file = document.getElementById('file').files[0];
    const out = document.getElementById('output');
    if (!key || !file) { out.textContent = 'Need both API key and file'; return; }

    configure({ apiKey: key });
    out.textContent = 'Extracting...';
    try {
      const data = await documents.extractInvoice(file);
      out.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
      out.textContent = 'Error: ' + e.message;
    }
  });
</script>

</body>
</html>
