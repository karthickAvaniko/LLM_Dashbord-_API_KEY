[supervisord]
nodaemon=false
logfile=/workspace/logs/supervisord.log
pidfile=/workspace/supervisord.pid
childlogdir=/workspace/logs

[program:vllm]
command=/workspace/venv/bin/vllm serve palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4
    --served-model-name qwen3.6-35b
    --host 0.0.0.0
    --port 8000
    --enforce-eager
    --trust-remote-code
directory=/workspace
autostart=true
autorestart=true
startsecs=10
startretries=3
stdout_logfile=/workspace/logs/vllm.log
stderr_logfile=/workspace/logs/vllm.log
stdout_logfile_maxbytes=50MB
priority=100

[program:dashboard]
command=/workspace/venv/bin/uvicorn runbod_main:app --host 0.0.0.0 --port 1111 --workers 1
directory=/workspace/dashboard
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/workspace/logs/dashboard.log
stderr_logfile=/workspace/logs/dashboard.log
stdout_logfile_maxbytes=20MB
priority=200
